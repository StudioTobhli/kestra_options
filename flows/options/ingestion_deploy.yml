id: ingestion_deploy
namespace: company.team

triggers:
  - id: weekday_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 7 * * 1-5"
    timezone: America/Los_Angeles

tasks:
  - id: git_namespace_sync
    type: io.kestra.plugin.git.SyncNamespaceFiles
    namespace: company.team
    gitDirectory: scripts_for_flow/options
    url: "{{ secret('GIT_REPO_URL') }}"
    username: "{{ secret('GIT_USERNAME') }}"
    password: "{{ secret('GIT_TOKEN') }}"
    branch: main
    
  - id: put_data_ingest
    type: io.kestra.plugin.scripts.python.Commands
    namespaceFiles:
      enabled: true
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
      image: options_python_img:latest
      networkMode: "kestra_options_default"
      volumes:
        - "/home/jedah/Projects/kestra_options/src_files:/app/src_files:ro"
    containerImage: ghcr.io/kestra-io/pydata:latest
    commands:
      - python put_data_ingest.py

  - id: holdings_ingest
    type: io.kestra.plugin.scripts.python.Commands
    namespaceFiles:
      enabled: true
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
      image: options_python_img:latest
      networkMode: "kestra_options_default"
      volumes:
        - "/home/jedah/Projects/kestra_options/src_files:/app/src_files:ro"
    containerImage: ghcr.io/kestra-io/pydata:latest
    commands:
      - python holdings_ingest.py

  - id: call_data_ingest
    type: io.kestra.plugin.scripts.python.Commands
